name: Terraform CC008 compliance check

on:
  workflow_call:
    inputs:
      terraform-directories:
        description: Non-empty JSON array of Terraform module directories to check.
        required: true
        type: string

permissions:
  contents: read

jobs:
  cc008-compliance:
    name: CC008 compliance (${{ matrix.terraform-directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform-directory: ${{ fromJSON(inputs.terraform-directories) }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.1
      - name: Checkout compliance checker
        uses: actions/checkout@v7.0.1
        with:
          repository: canonical/operator-workflows
          ref: feat/terraform-compliance
          sparse-checkout: terraform-compliance
          path: .operator-workflows
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: >-
          python -m pip install
          --requirement .operator-workflows/terraform-compliance/requirements.txt
      - name: Check required files
        id: required-files
        continue-on-error: true
        run: >-
          python .operator-workflows/terraform-compliance/cc008_check.py
          --verbose --check required-files
          "${{ matrix.terraform-directory }}"
      - name: Check terraform.tf configuration
        id: terraform-configuration
        continue-on-error: true
        run: >-
          python .operator-workflows/terraform-compliance/cc008_check.py
          --verbose --check terraform-configuration
          "${{ matrix.terraform-directory }}"
      - name: Check variables.tf ordering
        id: variable-ordering
        continue-on-error: true
        run: >-
          python .operator-workflows/terraform-compliance/cc008_check.py
          --verbose --check variable-ordering
          "${{ matrix.terraform-directory }}"
      - name: Check outputs.tf ordering
        id: output-ordering
        continue-on-error: true
        run: >-
          python .operator-workflows/terraform-compliance/cc008_check.py
          --verbose --check output-ordering
          "${{ matrix.terraform-directory }}"
      - name: Check module interface
        id: module-interface
        continue-on-error: true
        run: >-
          python .operator-workflows/terraform-compliance/cc008_check.py
          --verbose --check module-interface
          "${{ matrix.terraform-directory }}"
      - name: Check module sources are pinned
        id: module-sources
        continue-on-error: true
        run: >-
          python .operator-workflows/terraform-compliance/cc008_check.py
          --verbose --check module-sources
          "${{ matrix.terraform-directory }}"
      - name: Fail if any check reported violations
        if: >-
          steps.required-files.outcome == 'failure' ||
          steps.terraform-configuration.outcome == 'failure' ||
          steps.variable-ordering.outcome == 'failure' ||
          steps.output-ordering.outcome == 'failure' ||
          steps.module-interface.outcome == 'failure' ||
          steps.module-sources.outcome == 'failure'
        run: |
          echo "One or more CC008 compliance checks failed; see the steps above for details."
          exit 1
