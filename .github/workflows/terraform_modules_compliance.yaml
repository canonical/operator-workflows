name: Terraform modules compliance

on:
  workflow_call:
    inputs:
      terraform-directories:
        description: Non-empty JSON array of Terraform module directories to check.
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-compliance:
    name: Terraform modules compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout compliance checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: terraform-compliance
          path: .operator-workflows
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install checker dependencies
        run: >-
          python -m pip install
          --requirement .operator-workflows/terraform-compliance/requirements.txt
      - name: Check compliance
        run: >-
          python .operator-workflows/terraform-compliance/terraform_check.py
          --verbose
          ${{ join(fromJSON(inputs['terraform-directories']), ' ') }}
