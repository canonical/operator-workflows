name: Terraform modules compliance

on:
  workflow_call:
    inputs:
      terraform-directories:
        description: Non-empty JSON array of Terraform module directories to check.
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-compliance:
    name: CC008 compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.1
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@v1.0.4
        with:
          repository-name: canonical/operator-workflows
          file-name: terraform_modules_compliance.yaml
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout compliance checker
        uses: actions/checkout@v7.0.1
        with:
          repository: canonical/operator-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          sparse-checkout: terraform-compliance
          path: .operator-workflows
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: >-
          python -m pip install
          --requirement .operator-workflows/terraform-compliance/requirements.txt
      - name: Check compliance
        run: >-
          python .operator-workflows/terraform-compliance/cc008_check.py
          --verbose
          ${{ join(fromJSON(inputs['terraform-directories']), ' ') }}
