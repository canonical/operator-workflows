name: Plan Integration Tests
description: Preparing for integration tests.
author: is-devops-team@canonical.com
inputs:
  plan:
    description: operator-workflows plan.
    required: true
  github-token:
    description: github token
    required: true
  check-run-id:
    description: check run id
    required: true
  provider:
    description: Integration provider used for image transport.
    required: false
    default: microk8s
  containerd-socket:
    description: Canonical Kubernetes containerd socket for side-loading image archives.
    required: false
    default: ''
outputs:
  scans:
    description: required scans.
runs:
  using: node20
  main: ../../dist/plan-integration/index.js
