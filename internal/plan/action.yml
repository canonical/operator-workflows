name: Plan
description: Workflow planning for operator-workflows
author: is-devops-team@canonical.com
inputs:
  working-directory:
    description: Working directory for operator-workflows workflows.
    default: '.'
    required: true
  identifier:
    description: identifier
    default: ''
  upload-image:
    description: upload-image
    default: ''
  provider:
    description: Integration provider used to select the safe default image mode.
    default: microk8s
  artifact-retention-days:
    description: Number of days to retain build artifacts.
    default: '30'
outputs:
  plan:
    description: The generated plan for the entire workflow.
  image-output-type:
    description: The selected image output mode (file or registry).
runs:
  using: node20
  main: ../../dist/plan/index.js
